🔒 国内服务 = select,DIRECT,🚀 节点选择,REJECT

🌍 非中国 = select,🚀 节点选择,⚡ 自动选择,🇭🇰 香港节点,🇹🇼 台湾节点,🇯🇵 日本节点,🇺🇸 美国节点,🌐 其他节点,DIRECT,REJECT,policy-select-name=🇯🇵 日本节点

🐟 漏网之鱼 = select,🚀 节点选择,⚡ 自动选择,🇭🇰 香港节点,🇹🇼 台湾节点,🇯🇵 日本节点,🇺🇸 美国节点,🌐 其他节点,DIRECT,REJECT,policy-select-name=🇯🇵 日本节点

