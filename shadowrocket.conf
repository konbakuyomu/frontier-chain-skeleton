# > AI 服务 (LingJingMaster 自维护, 已含 anthropic / openai / chatgpt 主域)
RULE-SET,https://raw.githubusercontent.com/LingJingMaster/Shadowrocket-Rules/refs/heads/main/AI.list,🤖 AI 服务

# > 谷歌服务 (LingJingMaster 自维护)
