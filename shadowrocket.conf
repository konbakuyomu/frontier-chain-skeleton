# 关键: no-resolve = 跳过 SR 对域名请求的主动 DNS 解析（避免本地系统 DNS 暴露给 browserleaks）
# 域名请求未命中 DOMAIN-* 规则时, 直接走 FINAL → 漏网之鱼组（PROXY 隧道远端解析, 不在本地查 DNS）
# 该字段是 SR 防泄露的关键 (a-nomad.conf 实测零泄露配置精髓)
GEOIP,CN,🔒 国内服务,no-resolve

FINAL,🐟 漏网之鱼

[Host]
localhost = 127.0.0.1

[URL Rewrite]
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302
