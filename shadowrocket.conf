🛑 广告拦截 = select,REJECT,DIRECT,🚀 节点选择

Ⓜ️ 微软服务 = select,🚀 节点选择,⚡ 自动选择,🇭🇰 香港节点,🇹🇼 台湾节点,🇯🇵 日本节点,🇺🇸 美国节点,🌐 其他节点,DIRECT,REJECT,policy-select-name=🚀 节点选择

🍏 苹果服务 = select,DIRECT,🚀 节点选择,⚡ 自动选择,🇭🇰 香港节点,🇹🇼 台湾节点,🇯🇵 日本节点,🇺🇸 美国节点,🌐 其他节点,REJECT,policy-select-name=DIRECT

📲 电报消息 = select,🚀 节点选择,⚡ 自动选择,🇭🇰 香港节点,🇹🇼 台湾节点,🇯🇵 日本节点,🇺🇸 美国节点,🌐 其他节点,DIRECT,REJECT,policy-select-name=🚀 节点选择

🐱 代码托管 = select,🚀 节点选择,⚡ 自动选择,🇭🇰 香港节点,🇹🇼 台湾节点,🇯🇵 日本节点,🇺🇸 美国节点,🌐 其他节点,DIRECT,REJECT,policy-select-name=🚀 节点选择

